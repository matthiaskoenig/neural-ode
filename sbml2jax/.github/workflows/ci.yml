name: CI

on:
  push:
    branches: [develop, main]
    tags: ['*']
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uvx ruff check
      - run: uvx ruff format --check

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Cache the SBML test suite
        uses: actions/cache@v4
        with:
          path: ~/.cache/sbml2jax
          key: sbml-test-suite-3.5.0
      - name: Unit tests, the apixaban roadrunner check and the SBML test suite gate
        env:
          SBML2JAX_TESTSUITE: "1"
        run: uvx --with tox-uv tox -e py3.13 -- --durations=15
