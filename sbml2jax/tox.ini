[tox]
envlist = ruff, py3.13

[testenv]
# tox-uv creates the environment from uv.lock
runner = uv-venv-lock-runner
extras = dev
passenv =
    SBML2JAX_TESTSUITE
    SBML2JAX_CACHE
commands =
    pytest {posargs}

[testenv:ruff]
runner = uv-venv-lock-runner
extras = dev
commands =
    ruff check
    ruff format --check

[testenv:testsuite]
# gating test against the committed results of the SBML test suite
runner = uv-venv-lock-runner
extras = dev
setenv =
    SBML2JAX_TESTSUITE = 1
passenv =
    SBML2JAX_CACHE
commands =
    pytest -n 0 -m testsuite tests/test_testsuite_full.py
