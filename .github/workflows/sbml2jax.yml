name: sbml2jax

# only changes of the sbml2jax module (or of this workflow) run its checks
on:
  push:
    branches: [develop, main]
    paths: ["sbml2jax/**", ".github/workflows/sbml2jax.yml"]
  pull_request:
    branches: [develop, main]
    paths: ["sbml2jax/**", ".github/workflows/sbml2jax.yml"]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: sbml2jax

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uvx ruff check
      - run: uvx ruff format --check

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: sbml2jax/uv.lock
      - name: Put libpython on the library search path
        # the extension of libroadrunner links against libpython3.X.so.1.0; the
        # standalone interpreters of uv ship it but never load it, so without
        # this the import of roadrunner fails (same fix as in sbml2cellml)
        run: |
          uv python install 3.13
          prefix="$("$(uv python find --no-project 3.13)" -c 'import sys; print(sys.base_prefix)')"
          echo "LD_LIBRARY_PATH=${prefix}/lib" >> "$GITHUB_ENV"
        shell: bash
      - name: Cache the SBML test suite
        uses: actions/cache@v4
        with:
          path: ~/.cache/sbml2jax
          key: sbml-test-suite-3.5.0
      - name: Unit tests, the apixaban roadrunner check and the SBML test suite gate
        env:
          SBML2JAX_TESTSUITE: "1"
        run: uvx --with tox-uv tox -e py3.13 -- --durations=15
