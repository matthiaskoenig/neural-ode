# The documentation of the monorepo (zensical.toml, docs/). Not a package: the
# modules are the packages in the top-level directories, each with its own
# pyproject.toml. `uv sync` installs the tools which build the site.
[project]
name = "hybrid-pkpd-docs"
version = "0.0.0"
description = "Documentation of the hybrid PK/PD monorepo"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
docs = [
	"zensical>=0.1.1",
	"mkdocstrings-python>=2.0.10",
]

[tool.uv]
package = false
default-groups = ["docs"]
